   padding:7px 12px;color:var(--texto);cursor:pointer;font-size:12px}

 button.copiado{border-color:var(--verde);color:var(--verde)}
 .vazio{grid-column:1/-1;text-align:center;color:var(--fraco);padding:60px}

 smartphone recording feel", "midia": "", "tipo": "", "categoria": "PROMPT VOZ: NARRAÇÃO"}, {"data": "2026-03-22", "autor": "PROMPTS VIP AY", "subtopico": "PROMPT VOZ: NARRAÇÃO", "titulo": "Idioma: Português do Brasil", "prompt": "Idioma: Português do Brasil\n\nTexto a ser falado:\n\"O que quer que seja falado\"\n\nVoz:\nFeminina, jovem adulta (aprox. 20–30 anos)\n\nEstilo vocal:\nVoz aveludada, suave e levemente sussurrada (breathy), com ressonância limpa e natural.\nSem artificialidade. Evitar qualquer som robótico ou metálico.\n\nSotaque:\nBrasileiro neutro com leve influência carioca/fluminense, destacando suavemente os \"s\" chiados para criar uma sonoridade mais envolvente e levemente mística.\n\nEntonação:\nDelicada, íntima e contemplativa.\nComo se estivesse contando um segredo antigo ou descrevendo um sonho.\n\nRitmo:\nLento a moderado, fluido como um riacho.\nInserir pausas sutis e naturais entre palavras e frases para respiração.\n\nExpressão emocional:\nSuavidade, leve mistério e acolhimento.\nTransmitir calma e conexão emocional.\nSorriso sutil perceptível na voz.\n\nDireção:\nA fala deve soar orgânica, humana e espontânea — como um áudio gravado no celular em ambiente silencioso.\nSem exageros dramáticos.\n\nQualidade:\nAlta fidelidade, com textura vocal natural e microvariações realistas na respiração.\n\nObservações:\nSem legendas.\nSem trilha sonora.\nFoco total na naturalidade da voz.", "midia": "", "tipo": "", "categoria": "PROMPT VOZ: NARRAÇÃO"}, {"data": "2026-03-22", "autor": "PROMPTS VIP AY", "subtopico": "PROMPTS: CLONAR MOVIMENTO", "titulo": "APÓS ELE ENVIAR O COMANDO EM ANEXO, PEÇA PARA REPARTIR O ANEXO ENVIADO EM TRECHO", "prompt": "APÓS ELE ENVIAR O COMANDO EM ANEXO, PEÇA PARA REPARTIR O ANEXO ENVIADO EM TRECHOS FLUIDOS DE 6 SEGUNDOS", "midia": "", "tipo": "", "categoria": "PROMPTS: CLONAR MOVIMENTO"}, {"data": "2026-03-22", "autor": "PROMPTS VIP AY", "subtopico": "PROMPTS: CLONAR MOVIMENTO", "titulo": "Formato da saída", "prompt": "Formato da saída\nRetorne exclusivamente um JSON válido, sem explicações adicionais, seguindo exatamente esta estrutura:\n\n{\n  \"animation_purpose\": \"replicate motion only\",\n  \"visual_modification_policy\": {\n    \"allow_visual_changes\": false,\n    \"allowed_changes\": [],\n    \"forbidden_changes\": [\n      \"clothing color\",\n      \"clothing type\",\n      \"fabric\",\n      \"body shape\",\n      \"face\",\n      \"hair\",\n      \"lighting\",\n      \"background\",\n      \"style\"\n    ]\n  },\n  \"camera_behavior\": {\n    \"shot_type\": \"close-up | medium | full body\",\n    \"camera_motion\": \"static | subtle pan | fixed\",\n    \"camera_distance\": \"constant\",\n    \"perspective\": \"front | slight angle\"\n  },\n  \"animation_timeline\": [\n    {\n      \"time_range_seconds\": \"0-2\",\n      \"facial_motion\": {\n        \"eyes\": \"movement and blink pattern\",\n        \"mouth\": \"micro movement description\",\n        \"emotion_through_motion\": \"emotion inferred only from movement\"\n      },\n      \"body_motion\": {\n        \"head\": \"movement description\",\n        \"torso\": \"movement description\",\n        \"arms\": \"movement description\",\n        \"hands\": \"gesture description\",\n        \"legs\": \"stance or subtle movement\"\n      },\n      \"motion_characteristics\": {\n        \"intensity\": \"very subtle | subtle | moderate\",\n        \"speed\": \"slow | natural\",\n        \"direction\": \"left | right | forward | backward | stationary\",\n        \"fluidity\": \"smooth | continuous\"\n      },\n      \"camera_interaction\": \"level of awareness and engagement with camera\"\n    }\n  ],\n  \"global_motion_constraints\": {\n    \"movement_style\": \"natural and realistic\",\n    \"no_exaggeration\": true,\n    \"no_pose_change\": true,\n    \"no_identity_shift\": true,\n    \"motion_continuity_required\": true\n  }\n}", "midia": "", "tipo": "", "categoria": "PROMPTS: CLONAR MOVIMENTO"}, {"data": "2026-03-22", "autor": "PROMPTS VIP AY", "subtopico": "PROMPTS: CLONAR MOVIMENTO", "titulo": "PROMPT copiar movimentos 2 ⤵️⤵️⤵️", "prompt": "PROMPT copiar movimentos 2 ⤵️⤵️⤵️\n\nVocê é um sistema avançado de análise multimodal especializado exclusivamente em leitura de movimento, cinemática corporal, microexpressões faciais e interação com a câmera para vídeos curtos.\n\nSua função NÃO é reinterpretar aparência, roupa, cores, identidade ou estética.\nSua função é apenas extrair movimentos, ritmo, intenções corporais e padrões temporais a partir de um vídeo de referência.\n\n\nTarefa\nAnalisar detalhadamente o vídeo anexado frame a frame e extrair exclusivamente os movimentos e comportamentos corporais da modelo, sem inferir, alterar ou sugerir qualquer modificação visual.\n\n\nObjetivo final\nGerar um JSON técnico e estruturado que sirva como prompt de animação por movimento, onde:\n\n\n\nUma foto estática será fornecida posteriormente\n\nEssa foto NÃO pode ser alterada em absolutamente nenhum aspecto\n\nA foto será apenas animada, replicando fielmente os movimentos do vídeo analisado\n\nNenhuma modificação visual é permitida, incluindo, mas não limitado a:\n\n\nCor da roupa\nTipo de roupa\nTextura do tecido\nCorpo\nRosto\nCabelo\nIluminação\nCenário\nEstilo estético\n\nO sistema deve agir como um capturador de movimento conceitual, não como um gerador visual.\n\nREGRAS CRÍTICAS, NÃO VIOLÁVEIS\nPROIBIÇÃO TOTAL DE ALTERAÇÃO VISUAL\nNão descreva cores\nNão descreva tecidos\nNão descreva estilo de roupa\nNão descreva estética\nNão sugira mudanças físicas\nNão adapte aparência\nNão “recrie” nada visualmente\nA roupa presente no vídeo serve apenas como referência de como o corpo se move, nunca como algo a ser replicado visualmente.\n\nO JSON deve conter somente dados de movimento, nunca dados de aparência interpretativa.\nEscopo da análise de movimento\nAnalise apenas:\n\nMicroexpressões faciais, piscadas, tensão e relaxamento\nMovimento dos olhos e direção do olhar\nInclinação, rotação e microajustes da cabeça\nPostura corporal e distribuição de peso\nMovimento do tronco\nMovimento dos braços, mãos e dedos\nRitmo corporal\nPausas e retomadas\nInteração com a câmera\nFluidez e naturalidade\nIntensidade do movimento\nConsistência temporal\nSegmentação\nDivida o vídeo em segmentos temporais lógicos, mesmo que seja um único take.\nCada segmento deve representar uma mudança clara de ação, ritmo ou intenção corporal.\n\nPara cada segmento, descreva obrigatoriamente\nAção corporal principa\nEmoção transmitida pelo movimento\nIntensidade do movimento\nDireção espacial\nRitmo\nGrau de sutileza\nContinuidade em relação ao segmento anterior", "midia": "", "tipo": "", "categoria": "PROMPTS: CLONAR MOVIMENTO"}, {"data": "2026-03-22", "autor": "PROMPTS VIP AY", "subtopico": "PROMPTS: CLONAR MOVIMENTO", "titulo": "Você é um sistema avançado de análise multimodal especializado em visão computac", "prompt": "Você é um sistema avançado de análise multimodal especializado em visão computacional, linguagem corporal, moda, expressões faciais e narrativa visual para vídeo curto.\nTarefa:\nAnalisar detalhadamente o vídeo anexado frame a frame e extrair informações visuais, corporais e emocionais da modelo presente no vídeo.\nObjetivo final:\nGerar um JSON técnico e estruturado que sirva como prompt direto para um modelo de animação de vídeo a partir de imagem estática, onde uma única foto será animada com base neste JSON.\nRegras de análise:\n1. Analise o vídeo considerando:\n- Expressões faciais, sorriso, olhar, sobrancelhas, piscadas\n- Movimento da cabeça, inclinação, rotação, velocidade\n- Movimento do tronco, alongamento do corpo, postura\n- Movimento de braços, mãos, dedos\n- Caminhar, giros, pausas, mudanças de ritmo\n- Interação da modelo com a câmera\n- Transições entre cenas e mudanças de enquadramento\n- Dinâmica da roupa, esticar, dobrar, acompanhar movimento\n- Energia emocional transmitida em cada trecho\n2. Identifique momentos chave do vídeo e divida em segmentos temporais lógicos.\n3. Para cada segmento, descreva:\n- Ação principal\n- Emoção dominante\n- Intensidade do movimento\n- Direção do movimento\n- Ritmo\nFormato da saída:\nRetorne exclusivamente um JSON válido, sem explicações adicionais, seguindo esta estrutura:\n{\n\"character_description\": {\n\"gender\": \"female\",\n\"age_range\": \"estimate\",\n\"appearance\": {\n\"hair\": \"description\",\n\"clothing\": \"detailed description\",\n\"body_type\": \"description\"\n},\n\"overall_vibe\": \"short description\"\n},\n\"camera_behavior\": {\n\"shot_type\": \"close-up, medium, full body\",\n\"movement\": \"static, slow pan, zoom\",\n\"perspective\": \"front, slight angle\"\n},\n\"animation_timeline\": [\n{\n\"time_range_seconds\": \"0-2\",\n\"facial_expression\": {\n\"eyes\": \"description\",\n\"mouth\": \"description\",\n\"emotion\": \"description\"\n},\n\"body_motion\": {\n\"head\": \"description\",\n\"torso\": \"description\",\n\"arms\": \"description\",\n\"legs\": \"description\"\n},\n\"clothing_physics\": \"how fabric reacts\",", "midia": "", "tipo": "", "categoria": "PROMPTS: CLONAR MOVIMENTO"}, {"data": "2026-03-22", "autor": "PROMPTS VIP AY", "subtopico": "PROMPTS: CLONAR MOVIMENTO", "titulo": "Prompt pra copiar movimento, envie o arquivo de vídeo no Gemini", "prompt": "Prompt pra copiar movimento, envie o arquivo de vídeo no Gemini \nE mande esse prompt ⤵️", "midia": "", "tipo": "", "categoria": "PROMPTS: CLONAR MOVIMENTO"}, {"data": "2026-03-22", "autor": "PROMPTS VIP AY", "subtopico": "VÍDEO ESTILO POV: produto no cabide", "titulo": "🧠 PROMPT (UNIVERSAL — Veo / Runway / Sora / Kling)", "prompt": "🧠 PROMPT (UNIVERSAL — Veo / Runway / Sora / Kling)\n\nUltra realistic vertical video of a woman holding a clothing piece on a wooden hanger inside a modern boutique store, filmed in POV perspective, only hands visible, no face shown.\n\nCHARACTER (hands only):\nfemale hands, 20–30 years old, light to medium skin tone, natural skin texture, subtle veins and
